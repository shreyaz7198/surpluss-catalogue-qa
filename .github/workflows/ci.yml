name: CI Suite

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  unit-and-api-tests:
    name: Vitest Unit & Access Control
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Vitest Suite
        run: npx vitest run

  e2e-tests:
    name: Playwright Buyer Journey
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surpluss
          POSTGRES_PASSWORD: surpluss_password
          POSTGRES_DB: surpluss_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://surpluss:surpluss_password@localhost:5432/surpluss_dev
      DIRECT_URL: postgresql://surpluss:surpluss_password@localhost:5432/surpluss_dev
      AUTH_SECRET: ci-temporary-auth-secret-32-characters-minimum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run DB Migrations & Seed
        run: |
          npx prisma db push
          npx prisma db seed

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Test Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14